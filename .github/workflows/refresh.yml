# Weather cloud refresh (W-019): downloads ECMWF / BOM / Copernicus on GitHub's computer, keeps only the NEM east coast,
# publishes small files on the release "data". Weather.exe checks for them every 15 minutes.
# Times are UTC (GitHub has no daylight saving; ECMWF works in UTC too, so these suit summer and winter):
#   19:52 light – ECMWF's overnight (12z) IFS + AIFS are complete at 19:34 UTC. = 6:52 am Sydney summer / 5:52 am winter
#   20:22 light – back-up if 19:52 is skipped or late; also picks up BOM's later morning issues. = 7:22 am / 6:22 am
#   10:07 full  – + ensemble (complete 08:01 UTC) + seasonal. = 9:07 pm / 8:07 pm
# Off the round :00 / :30 minutes – GitHub starts round-time schedules late or skips them when busy (seen 21 Oct).
name: Weather refresh

on:
  schedule:
    - cron: "52 19 * * *"
    - cron: "22 20 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (~20 min, with ensemble + seasonal) · light (BOM + IFS + AIFS) · bom (BOM only)"
        type: choice
        options: [light, full, bom]
        default: light

permissions:
  contents: write   # to publish the release files

concurrency:
  group: weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -r "3. Code/weather/requirements-cloud.txt"

      - name: Copernicus key (from the hidden secret)
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          # strip invisible characters (e.g. a byte-order mark) and spaces around the key
          KEY=$(printf '%s' "$CDSAPI_KEY" | sed 's/^\xEF\xBB\xBF//' | tr -d '[:space:]')
          if [ -n "$KEY" ]; then
            printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$KEY" > ~/.cdsapirc
          fi

      - name: Download, keep the NEM east coast, publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 10 * * *' && 'full' || 'light') }}
        run: python "3. Code/weather/cloud/publish.py" --mode "$MODE"
